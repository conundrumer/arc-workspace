[project]
name = "arc"
version = "0.1.0"
description = "ARC-AGI-2 work"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc", "src/dl", "src/study"]

[dependency-groups]
dev = [
  "pandas>=3.0.5",
  "pyright>=1.1.409",
  "pytest>=8",
  "pytest-xdist>=3",
  "ruff>=0.7",
  "tabulate>=0.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"programs/solvers/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Four workers is where this suite stops gaining: the run is short enough
# that another worker's startup costs more than the tests it takes. Pass
# `-n 0` for one process, which a debugger or `-s` needs.
addopts = "-ra -n 4"

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "data", "archive"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pyrefly]
search-path = [".", "src"]
