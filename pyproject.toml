[project]
name = "arc"
version = "0.1.0"
description = "ARC-AGI-2 work"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc", "src/dl"]

[dependency-groups]
dev = [
  "pyright>=1.1.409",
  "pytest>=8",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"programs/solvers/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "data", "archive"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pyrefly]
search-path = [".", "src"]
