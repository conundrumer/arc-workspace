[project]
name = "arc"
version = "0.1.0"
description = "ARC-AGI-2 work"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc", "src/controlled_markdown", "src/study"]

[dependency-groups]
dev = [
  "coverage>=7.16.2",
  "pandas>=3.0.5",
  "pandas-stubs>=3.0.5",
  "pyright>=1.1.409",
  "pytest>=8",
  "ruff>=0.7",
  "tabulate>=0.10.0",
  "typing-extensions>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"programs/solvers/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
# Only checks that track an in-progress feature live under tests/. They fail
# on purpose, so no change check or merge runs them and a run names them by
# path.
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "data", "archive", "src/arclog_convert"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pyrefly]
search-path = [".", "src"]

[tool.controlled_markdown]
# The agent-facing documents. `check` and `fmt` read this set when no path is
# given, so the command that guards them is one word wherever it is written.
paths = ["CLAUDE.md", "docs/handbook", "prompts", ".claude/skills",
         "src/controlled_markdown"]
