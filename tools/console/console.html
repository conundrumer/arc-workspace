<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>solver console</title>
<style>
:root {
  --bg:#F6F7F5; --panel:#FFFFFF; --panel2:#EFF1EE; --ink:#1A1D21; --muted:#67707C;
  --border:#E2E5E1; --accent:#0F766E; --accent-ink:#FFFFFF;
  --well:#14171B; --well-line:#2A2F36;
  --st-review:#B45309; --st-review-bg:#FDF0DE;
  --st-running:#2563EB; --st-running-bg:#E4EDFD;
  --st-commented:#7C3AED; --st-commented-bg:#EFE8FD;
  --st-approved:#15803D; --st-approved-bg:#E2F4E8;
  --st-muted:#67707C; --st-muted-bg:#ECEEEA;
  --st-removed:#B91C1C; --st-removed-bg:#FBE6E6;
  --ttl-ok:#15803D; --ttl-warn:#B45309; --ttl-hot:#B91C1C;
  --sel:#0F766E14;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#101418; --panel:#161B21; --panel2:#1C2229; --ink:#E6EAEE; --muted:#8B96A3;
  --border:#232A32; --accent:#2DD4BF; --accent-ink:#0B1210;
  --well:#0B0E11; --well-line:#242A31;
  --st-review:#F5A623; --st-review-bg:#3A2C10;
  --st-running:#60A5FA; --st-running-bg:#152B4A;
  --st-commented:#A78BFA; --st-commented-bg:#2B2150;
  --st-approved:#4ADE80; --st-approved-bg:#123A22;
  --st-muted:#8B96A3; --st-muted-bg:#20262D;
  --st-removed:#F87171; --st-removed-bg:#3B1618;
  --ttl-ok:#4ADE80; --ttl-warn:#F5A623; --ttl-hot:#F87171;
  --sel:#2DD4BF1A;
}}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font:13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
#app { flex:1; min-height:0; display:flex; flex-direction:column; }
code, pre, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* ---------- top bar ---------- */
#topbar {
  min-height:46px; flex:none; display:flex; flex-wrap:wrap; align-items:center;
  gap:4px 14px; padding:4px 14px;
  background:var(--panel); border-bottom:1px solid var(--border);
}
#topbar .wordmark, #topbar .wavectl { white-space:nowrap; }
#topbar .wordmark { font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:.08em; }
#topbar .wordmark b { color:var(--accent); }
#counts { display:flex; gap:6px; align-items:center; }
.chip {
  display:inline-flex; align-items:center; gap:5px; padding:1px 8px; border-radius:999px;
  font-size:11px; font-family:ui-monospace,Menlo,monospace; white-space:nowrap;
}
.chip .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.chip.review    { color:var(--st-review);    background:var(--st-review-bg); }
.chip.running   { color:var(--st-running);   background:var(--st-running-bg); }
.chip.commented { color:var(--st-commented); background:var(--st-commented-bg); }
.chip.approved  { color:var(--st-approved);  background:var(--st-approved-bg); }
.chip.queued, .chip.committed { color:var(--st-muted); background:var(--st-muted-bg); }
/* the bar's flexible slot. Every readout whose width moves with the state —
   the counts, the committing chip, the autopilot tally, the usage figures —
   sits on its left, so the wave controls hold their place under the pointer
   while a session runs. */
#usage { display:flex; flex:1; justify-content:flex-end; gap:12px;
  font-family:ui-monospace,Menlo,monospace; font-size:11px; white-space:nowrap; }
#usage .uok { color:var(--ttl-ok); opacity:.75; }
#usage .uwarn { color:var(--ttl-warn); }
#usage .uhot { color:var(--ttl-hot); }
.wavectl { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.wavectl input, .wavectl select {
  padding:3px 6px; border:1px solid var(--border); border-radius:5px;
  background:var(--bg); color:var(--ink); font-family:ui-monospace,Menlo,monospace; font-size:12px;
}
.wavectl input { width:44px; }
.wavectl input[type=checkbox] { width:auto; }
.wavectl label { display:inline-flex; align-items:center; gap:4px; cursor:pointer; }
button {
  font:12px system-ui,sans-serif; padding:5px 12px; border-radius:6px; cursor:pointer;
  border:1px solid var(--border); background:var(--panel2); color:var(--ink);
}
button:hover { border-color:var(--muted); }
button:focus-visible, textarea:focus-visible, input:focus-visible, .row:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
button:disabled { opacity:.45; cursor:default; }
button:disabled:hover { border-color:var(--border); }

/* ---------- overnight panel ---------- */
#nightbtn.on   { border-color:var(--st-approved); color:var(--st-approved); }
#nightbtn.held { border-color:var(--st-review);   color:var(--st-review); }
#nightpanel {
  flex:none; padding:8px 14px; background:var(--panel2);
  border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px;
}
.nightrow {
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--muted);
}
.nightrow label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
.nightrow b { color:var(--ink); font-weight:600; }
.nightrow input[type=number] {
  width:46px; padding:2px 5px; border:1px solid var(--border); border-radius:5px;
  background:var(--bg); color:var(--ink); font-family:inherit; font-size:11.5px;
}
.nightrow .gate-open { color:var(--ttl-ok); }
.nightrow .gate-held { color:var(--ttl-warn); }
#nightlog {
  display:flex; flex-direction:column; gap:2px; height:72px; overflow-y:auto;
  font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--muted);
}

/* ---------- committer panel ---------- */
#commitbtn.on { border-color:var(--st-commented); color:var(--st-commented); }
#commitpanel { flex:none; background:var(--panel2); border-bottom:1px solid var(--border); }
#commitfeed {
  display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;
  padding:8px 14px;
}

/* ---------- main ---------- */
#main { flex:1; display:grid; grid-template-columns:250px minmax(400px,560px) 1fr; min-height:0; }
/* the finalize lens lists the unfinalized solvers beside its rows, which needs the width */
body.view-final #main { grid-template-columns:330px minmax(360px,520px) 1fr; }
.viewtog { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.viewtog button { border:none; border-radius:0; padding:4px 10px; background:var(--panel); color:var(--muted); }
.viewtog button.on { background:var(--accent); color:var(--accent-ink); }

/* left rail */
#rail { border-right:1px solid var(--border); overflow-y:auto; background:var(--panel); }
#rail .railhead {
  padding:8px 12px 4px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  display:flex; justify-content:space-between;
}
#rail .railhead .bktog { display:flex; gap:2px; }
#rail .railhead .bktog button {
  border:none; background:none; padding:0 3px; cursor:pointer;
  font:inherit; letter-spacing:inherit; text-transform:inherit; color:var(--muted);
}
#rail .railhead .bktog button.on { color:var(--accent); }
.row .bksz { font-size:11px; color:var(--muted); }
.row {
  display:flex; align-items:center; gap:9px; padding:7px 10px; cursor:pointer;
  border-left:3px solid transparent;
}
.row:hover { background:var(--sel); }
.row.sel { background:var(--sel); border-left-color:var(--accent); }
.row canvas, .row .thumb-ph { flex:none; border-radius:2px; background:var(--well); }
.row .thumb-ph { width:30px; height:30px; }
.row .meta { min-width:0; flex:1; }
.row .tid { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
.row .sub { font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .side { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
.badge-upd {
  font-size:9px; letter-spacing:.06em; padding:1px 5px; border-radius:3px;
  background:var(--st-review); color:var(--bg); font-weight:600;
}
.badge-dirty {
  font-size:9px; letter-spacing:.06em; padding:1px 5px; border-radius:3px;
  background:var(--st-commented); color:var(--bg); font-weight:600;
}
/* a proposal comp: the code form of a proposals.md entry, and nothing else */
.badge-comp {
  font-size:9px; letter-spacing:.06em; padding:0 4px; border-radius:3px;
  font-family:ui-monospace,Menlo,monospace; font-weight:600;
  background:var(--st-review-bg); color:var(--st-review);
  border:1px solid var(--st-review);
}
.badge-comp.unproposed { background:var(--st-removed); color:var(--bg); border-color:transparent; }
/* an entry the task added with no comp behind it */
.badge-comp.entry { background:transparent; border-style:dashed; }
/* callouts the stage left for the user */
.badge-call {
  font-size:9px; letter-spacing:.06em; padding:0 4px; border-radius:3px;
  font-family:ui-monospace,Menlo,monospace; font-weight:600;
  background:var(--st-running-bg); color:var(--st-running);
  border:1px solid var(--st-running);
}
/* colored by the most urgent self-rank among the entries */
/* P0: broken tooling — the ruling the queue waits on */
.badge-call.r0 { background:var(--st-removed); color:var(--bg); border-color:var(--ink); }
.badge-call.r1 { background:var(--st-removed); color:var(--bg); border-color:transparent; }
.badge-call.r2 { background:var(--st-review-bg); color:var(--st-review); border-color:var(--st-review); }
/* the pass landed and wrote no solver: the one badge that reads inert, since
   the row is not a finalize candidate */
.badge-none {
  font-size:9px; letter-spacing:.06em; padding:0 4px; border-radius:3px;
  font-family:ui-monospace,Menlo,monospace; font-weight:600;
  background:var(--st-muted-bg); color:var(--st-muted);
  border:1px solid var(--st-muted);
}
/* unfinalized rows: solvers the user has not ruled on, not console items */
.row.bk { cursor:pointer; }
.bkmore { margin:6px 12px; }
.peektext { white-space:pre-wrap; font-size:12px; line-height:1.55; padding:10px 14px; }
.ttl { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; display:inline-flex; align-items:center; gap:4px; }
.ttl::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.ttl.ok { color:var(--ttl-ok); }
.ttl.warn { color:var(--ttl-warn); }
.ttl.hot { color:var(--ttl-hot); }
.ttl.cold, .ttl.none { color:var(--st-muted); }
.ttl.cold::before { background:transparent; border:1px solid currentColor; }
.ttl.none::before { display:none; }
.ttl.active { color:var(--st-running); }
.row .phz { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--st-muted); letter-spacing:.04em; }
.row .phz.fin { color:var(--ink); }

/* middle: session feed */
#judge { border-right:1px solid var(--border); overflow-y:auto; display:flex; flex-direction:column; min-height:0; background:var(--bg); }
#judge-head { flex:none; padding:10px 16px 8px; border-bottom:1px solid var(--border); background:var(--panel); }
#judge-head:empty { display:none; }
#judge-scroll { flex:1; overflow-y:auto; padding:10px 16px 6px; }
.dhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.dhead .tid { font-family:ui-monospace,Menlo,monospace; font-size:17px; font-weight:600; }
.sessline {
  display:flex; align-items:center; gap:8px; margin-top:6px; font-size:11px; color:var(--muted);
  font-family:ui-monospace,Menlo,monospace; flex-wrap:wrap;
}
.sessline .cmd { background:var(--panel2); border:1px solid var(--border); padding:1px 7px; border-radius:4px; }
.copybtn { font-size:10px; padding:2px 8px; }
.stabs {
  display:flex; gap:16px; margin-top:7px;
  font-family:ui-monospace,Menlo,monospace; font-size:11.5px;
}
.stab { cursor:pointer; color:var(--muted); }
.stab:hover { color:var(--ink); }
.stab.on { color:var(--ink); text-decoration:underline; text-underline-offset:4px; }
.stab .bdg {
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--st-review); margin-left:5px;
}

/* feed */
#feed { display:flex; flex-direction:column; gap:10px; }
.report {
  background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden;
}
.report .body { padding:11px 13px; }
.report .body > * { max-width:66ch; }
.report .body p, .report .body ul, .report .body ol { margin:0 0 9px; }
.report .body > :last-child { margin-bottom:0; }
.report .body li { margin-bottom:4px; }
.report .body h1, .report .body h2, .report .body h3, .report .body h4 { margin:10px 0 6px; font-size:12px; }
.report code, .msg code { background:var(--panel2); border:1px solid var(--border); border-radius:3px; padding:0 3px; font-size:11.5px; }
.report pre { background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:8px 10px; overflow-x:auto; font-size:11px; }
.report pre code { background:none; border:none; padding:0; }
/* ARC palette on cell digits in grid runs and on swatch code spans.
   Doubled so a swatch on a code element outweighs the inline-code chip. */
.cw.cw0 { background:#111; color:#888; } .cw.cw1 { background:#0074D9; color:#fff; }
.cw.cw2 { background:#FF4136; color:#fff; } .cw.cw3 { background:#2ECC40; color:#000; }
.cw.cw4 { background:#FFDC00; color:#000; } .cw.cw5 { background:#AAA; color:#000; }
.cw.cw6 { background:#F012BE; color:#fff; } .cw.cw7 { background:#FF851B; color:#000; }
.cw.cw8 { background:#7FDBFF; color:#000; } .cw.cw9 { background:#870C25; color:#fff; }
/* The paint reaches into the gap between cells; the negative margin gives
   back what the padding takes, so a run keeps its column alignment. Under
   .22em a one-space gap still separates two neighbours. */
span.cw { border-radius:2px; padding:0 .22em; margin:0 -.22em; }
.cite { border-bottom:1px dotted var(--accent); cursor:pointer; }
.cite:hover { background:var(--panel2); }
#citepop { position:fixed; z-index:60; background:var(--bg); border:1px solid var(--border);
  border-radius:6px; padding:8px 10px; box-shadow:0 4px 16px rgba(0,0,0,.3);
  max-width:400px; max-height:70vh; overflow:auto; }
#citepop .cphead { font-family:ui-monospace,Menlo,monospace; font-size:10.5px;
  color:var(--muted); margin-bottom:6px; display:flex; gap:8px; align-items:center; }
#citepop .cpx { margin-left:auto; border:none; background:none; color:var(--muted);
  cursor:pointer; font-size:12px; padding:0 2px; }
#citepop .cpnote { font-size:11px; color:var(--muted); margin-top:4px; }
.agrid .hl { box-shadow:inset 0 0 0 1.5px #fff, 0 0 0 1.5px #000; position:relative; z-index:1; }
.msg { max-width:56ch; padding:7px 11px; border-radius:8px; font-size:12.5px; }
.msg p { margin:0 0 6px; }
.msg > :last-child { margin-bottom:0; }
.msg pre { background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:6px 8px; overflow-x:auto; font-size:11px; margin:0 0 6px; }
.msg pre code { background:none; border:none; padding:0; }
.msg ul, .msg ol { margin:0 0 6px; padding-left:18px; }
.msg.you { align-self:flex-end; background:var(--accent); color:var(--accent-ink); }
.msg.you code { background:transparent; border-color:transparent; color:inherit; }
.msg.you pre { background:rgba(0,0,0,.15); border-color:transparent; color:inherit; }
.msg.worker { align-self:flex-start; background:var(--panel2); border:1px solid var(--border); }
.msg.steer { align-self:flex-end; color:var(--accent); border:1px dashed var(--accent); }
.event { align-self:center; font-size:10.5px; color:var(--muted); font-family:ui-monospace,Menlo,monospace; }
.tools {
  align-self:flex-start; display:flex; flex-direction:column; gap:2px;
  font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--muted);
  border-left:2px solid var(--border); padding:2px 0 2px 10px; margin-left:4px;
  overflow-wrap:anywhere;
}
.tools .tl b { color:var(--ink); font-weight:600; }
.msg.worker.sub { margin-left:22px; opacity:.75; }
.msg.ask {
  align-self:flex-start; margin-left:22px; opacity:.75;
  background:var(--panel); border:1px dashed var(--border);
}
.msg.worker.sub::before, .msg.ask::before {
  content:"subagent"; display:block; font-family:ui-monospace,Menlo,monospace;
  font-size:9.5px; color:var(--muted); margin-bottom:3px;
}
.msg.ask::before { content:"subagent brief"; }
.tools .tl.sub { opacity:.65; padding-left:12px; }
.placeholder { color:var(--muted); font-size:12.5px; font-style:italic; }
.runpulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--st-running); margin-right:6px; animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
@media (prefers-reduced-motion: reduce) { .runpulse { animation:none; } }

/* comment box */
#composer {
  flex:none; border-top:1px solid var(--border); background:var(--panel); padding:10px 16px 8px;
}
#composer textarea {
  width:100%; min-height:44px; max-height:140px; resize:vertical;
  background:var(--bg); color:var(--ink); border:1px solid var(--border); border-radius:7px;
  padding:8px 10px; font:12.5px system-ui,sans-serif;
}
#composer .hints { display:flex; justify-content:space-between; margin-top:5px; font-size:10.5px; color:var(--muted); }
#composer .actions { display:flex; gap:8px; align-items:center; }
#composer.disabled textarea { opacity:.5; }

/* right: task + code column */
#codecol { overflow:hidden; display:flex; flex-direction:column; min-height:0; background:var(--panel); }
#taskstrip { flex:none; border-bottom:1px solid var(--border); }
#taskstrip .taskhead {
  display:flex; align-items:center; gap:10px; padding:7px 14px; cursor:pointer; user-select:none;
  background:var(--panel2); font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--muted);
}
#taskstrip .taskhead:hover { color:var(--ink); }
#taskstrip .caret { display:inline-block; transition:transform .12s; }
#taskstrip.open .caret { transform:rotate(90deg); }
@media (prefers-reduced-motion: reduce) { #taskstrip .caret { transition:none; } }
#taskbody { display:none; max-height:38vh; overflow:auto; padding:10px 14px; }
#taskstrip.open #taskbody { display:block; }
.gridwell { background:var(--well); border-radius:6px; padding:10px; overflow-x:auto; }
.pairrow { display:flex; gap:18px; flex-wrap:wrap; }
.pair { display:flex; align-items:center; gap:8px; }
.pair .arr { color:#5C6670; font-size:14px; }
.gwrap { display:flex; flex-direction:column; gap:4px; }
.glabel { font-size:9.5px; color:#7C8791; font-family:ui-monospace,Menlo,monospace; letter-spacing:.05em; }
.agrid { display:grid; gap:1px; background:var(--well-line); width:max-content; border:1px solid var(--well-line); }
.agrid div { width:var(--cell); height:var(--cell); }

#codecol .codehead {
  flex:none; display:flex; align-items:center; gap:10px; padding:7px 14px;
  border-bottom:1px solid var(--border); background:var(--panel2);
  font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--muted);
}
#codecol .codehead .fname {
  color:var(--ink); display:flex; gap:6px 12px; flex-wrap:wrap;
  flex:0 1 auto; min-width:0;
}
#codecol .codehead #flines { white-space:nowrap; flex:none; }
#codecol .codehead #codebtns { flex:none; }
.ftab { cursor:pointer; color:var(--muted); flex:none; }
.ftab:hover { color:var(--ink); }
.ftab.on { color:var(--ink); text-decoration:underline; text-underline-offset:4px; }
#codecol pre {
  flex:1; overflow:auto; margin:0; padding:12px 16px; font-size:11.5px; line-height:1.55; tab-size:4;
  white-space:pre-wrap; overflow-wrap:break-word; counter-reset:ln;
}
#codecol pre .cm { color:var(--muted); }
#codecol pre .L {
  display:block; position:relative; box-sizing:border-box;
  margin:0 -16px; padding:0 16px 0 calc(16px + 5.5ch);
}
#codecol pre .L::before {
  counter-increment:ln; content:counter(ln);
  position:absolute; left:0; width:calc(16px + 4ch); text-align:right;
  color:var(--muted); opacity:.55; user-select:none;
}
#codecol pre .L.del::before { counter-increment:none; content:""; }
#codecol pre .L.add { background:var(--st-approved-bg); box-shadow:inset 2px 0 0 var(--st-approved); }
#codecol pre .L.del { background:var(--st-removed-bg); box-shadow:inset 2px 0 0 var(--st-removed); }
#codecol pre mark.addw {
  background:color-mix(in srgb, var(--st-approved) 30%, transparent);
  color:inherit; border-radius:2px;
}
#codecol pre mark.delw {
  background:color-mix(in srgb, var(--st-removed) 30%, transparent);
  color:inherit; border-radius:2px;
}

/* bottom keys bar */
#keysbar {
  height:26px; flex:none; display:flex; align-items:center; gap:16px; padding:0 14px;
  background:var(--panel); border-top:1px solid var(--border);
  font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--muted); overflow-x:auto; white-space:nowrap;
}
#keysbar b { color:var(--ink); font-weight:600; }

/* toast */
#toast {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:7px; font-size:12px;
  font-family:ui-monospace,Menlo,monospace; opacity:0; transition:all .15s ease; z-index:30;
  max-width:80vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app"></div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/diff.min.js"></script>
<script type="module">
/* UI: preact + hooks + htm, vendored from htm@3.1.1/preact/standalone.module.js */
import { html, render, useState, useEffect, useLayoutEffect, useRef, useMemo, useCallback }
  from "/vendor/htm-preact-standalone.module.js";
import { esc, pad2, fmtDur, md } from "/ui/prose.js";
import { cmify, diffHtml } from "/ui/diff.js";
import { toast, copy, bindToast } from "/ui/toast.js";
import { useClock, useClocked, onTick } from "/ui/clock.js";
import { useServer, tasks, itemData, peeks, notify, post,
         ensureTask, ensureItem, ensurePeek, startPoll } from "/ui/server.js";

const ARC = ["#000000","#0074D9","#FF4136","#2ECC40","#FFDC00","#AAAAAA","#F012BE","#FF851B","#7FDBFF","#870C25"];
const CHIPCLS = {"needs-review":"review","commented":"commented","running":"running","queued":"queued","approved":"approved","committed":"committed"};
const TTL_MIN = 60;
const TTL_ALERT = 10;   // minutes left when a cache goes hot and rings
const FINAL = "finalize";
const STATES = ["needs-review","commented","running","queued","approved","committed"];
const SETTLED = ["approved","committed"];   // nothing left for a finalize pass to do
/* finalize lens orderings: the server's triage sort, a complexity measure, or
   the models that made the passes. One choice orders both sections; in the
   finalizing section it orders the cold sessions, behind the warm ones. */
const BK_ORDERS = {flag:"triage order",
                   passes:"grouped by the models of the passes, triage order within",
                   ts:"reference TS solver complexity",
                   dl:"solver rule-literal count"};
const BK_SHOWN = 40;   // unfinalized rows listed until the user asks for the rest
const passLabel = b => (b.passes||[]).map(p=>p.model).join(" ");
/* the chosen ordering over lens rows; the triage rank is the row's place in
   the server's list, and a task with no row goes last */
const triage = r => r.triage ?? Infinity;
const bkCmp = order => (a,b) => {
  if(order==="flag") return triage(a)-triage(b) || 0;
  if(order==="passes") return passLabel(a).localeCompare(passLabel(b)) || triage(a)-triage(b) || 0;
  const k=order+"_size", av=a[k]??-1, bv=b[k]??-1;
  return bv-av || (a.id<b.id?-1:1);
};
const sizeOf = (row, order) => ["flag","passes"].includes(order) ? null : (row[order+"_size"] ?? "—");
const RAIL_SHOWN = 40;   // wave rows listed until the user asks for the rest
const stateRank = it => { const i=STATES.indexOf(it.state); return i<0?STATES.length:i; };
const NO_ITEM = {feed:[], files:[]};   // stands in until /api/item lands

/* ---------- helpers ---------- */
const draftKey = id => "draft:"+id;

/* the item's stage chain: every per-session readout is keyed by stage name */
const stagesOf = it => it.chain||[];
const stageNames = it => stagesOf(it).map(x=>x.name);
const stageOf = (it,s) => stagesOf(it).find(x=>x.name===s) || {name:s, backend:"claude", model:""};
const modelOf = (it,s) => stageOf(it,s).model || "";
const backendOf = (it,s) => stageOf(it,s).backend || "claude";
const nextName = it => { const ns=stageNames(it), i=ns.indexOf(it.phase);
  return i>=0 && i+1<ns.length ? ns[i+1] : null; };
const modelShort = (it,s) => { const m=modelOf(it,s);
  if(!m) return "?";
  return backendOf(it,s)==="codex" ? m.replace(/-codex$/,"") : m.replace(/^claude-/,"").split("-")[0]; };
const stageLabel = (it,s) => s+" · "+(backendOf(it,s)==="codex"?"codex ":"")+modelShort(it,s);
/* interactive commands that reproduce the workers' prompt bytes (cache reuse),
   on the model the worker ran so the resumed session keeps its cache */
const takeoverCmd = (it,s,cli) => backendOf(it,s)==="codex"
  ? "codex exec resume "+it.sessions[s]
  : "claude --resume "+it.sessions[s]
    +(modelOf(it,s)?" --model "+modelOf(it,s):"")
    +` --append-system-prompt "$(cat ${it.append})" --add-dir ${cli.addDir} --exclude-dynamic-system-prompt-sections`;
const hasTab = (it,s) => !!(it.sessions[s]) || it.phase===s;

/* cache freshness of the phase-owning session: minutes until its 1h
   prompt-cache TTL expires. The sort key carries the rail order: sessions
   with no cache to lose lead, then the live turns, then the warm ones by
   nearest expiry. A cold cache is past saving, so those sort by state
   instead and the rail groups them the way the counts row reads. */
function cacheInfo(it){
  const la = it.lastActive && it.lastActive[it.phase];
  if(!it.sessions || !it.sessions[it.phase]) return {cls:"none", txt:"—", sort:-1};
  if(it.active) return {cls:"active", sort:5e8,
    txt: it.turnStarted ? fmtDur(Date.now()/1000-it.turnStarted) : "active"};
  if(!la) return {cls:"none", txt:"—", sort:-1};
  const rem = TTL_MIN - (Date.now()-la)/60000;
  if(rem<=0) return {cls:"cold", txt:"cold", sort:1e9+stateRank(it)};
  const cls = rem<TTL_ALERT?"hot":rem<30?"warn":"ok";
  return {cls, txt:Math.ceil(rem)+"m", sort:rem};
}

/* A cache crossing TTL_ALERT rings once. An item is armed while its
   countdown sits above the threshold, so one first seen below it stays
   silent and a reload does not replay crossings already past. A finished
   turn moves lastActive forward, which arms the next cycle. */
const ttlArmed = new Map();   // item id -> the lastActive it was armed for
const TTL_QUIET = new Set(["approved","committed"]);   // settled, let them go cold

function ttlWatch(items){
  for(const it of items){
    if(it.active || TTL_QUIET.has(it.state) ||
       !it.sessions || !it.sessions[it.phase]) continue;
    const la = it.lastActive && it.lastActive[it.phase];
    if(!la) continue;
    const rem = TTL_MIN - (Date.now()-la)/60000;
    if(rem>=TTL_ALERT) ttlArmed.set(it.id, la);
    else if(rem>0 && ttlArmed.get(it.id)===la){ ttlArmed.delete(it.id); ding(); }
  }
}

/* Two-tone chime. WebAudio opens suspended until the page has seen a
   gesture, so the first click or keypress in the console unlocks it. */
let actx = null;
function audio(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!actx && Ctx) actx = new Ctx();
  return actx;
}
function ding(){
  const ac = audio();
  if(!ac || ac.state!=="running") return;
  const t0 = ac.currentTime;
  [880, 1320].forEach((hz,i)=>{
    const at = t0 + i*0.14;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type="sine"; osc.frequency.value=hz;
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(0.2, at+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, at+0.3);
    osc.connect(gain).connect(ac.destination);
    osc.start(at); osc.stop(at+0.32);
  });
}
for(const ev of ["pointerdown","keydown"])
  addEventListener(ev, ()=>{ const ac=audio(); if(ac) ac.resume(); }, {once:true});

/* ---------- small pieces ---------- */
function CompBadges({x}){
  const comps=x.comps||[];
  return comps.map(c=>{
    const bad=(x.comps_unproposed||[]).includes(c);
    return html`<span key=${c} class=${"badge-comp"+(bad?" unproposed":"")}
      title=${bad?"no proposals.md entry":"proposals.md entry open"}>${c}</span>`;
  }).concat((x.entries||[]).filter(e=>!comps.includes(e)).map(e=>
    html`<span key=${"e:"+e} class="badge-comp entry"
      title="proposals.md entry this task added, with no comp">${e}</span>`));
}
/* what the stage left for the user; the entries ride along in the tooltip */
function CalloutBadge({x}){
  if(!x.callout_n) return null;
  const r = x.callout_rank;
  return html`<span class=${"badge-call"+(r!=null?" r"+r:"")} title=${(x.callouts||[]).join("\n")}>${r===0?"P0 · ":""}${x.callout_n}</span>`;
}
function StateChip({state, label}){
  return html`<span class=${"chip "+CHIPCLS[state]}><span class="dot"></span>${label!==undefined?label:state}</span>`;
}

function cellPx(w,h){ const m=Math.max(w,h); return m<=10?16:m<=15?12:m<=22?9:7; }
function Grid({g, label, places}){
  const w=g[0].length, h=g.length, px=cellPx(w,h);
  return html`<div class="gwrap">
    ${label && html`<div class="glabel">${label+" · "+h+"×"+w}</div>`}
    <div class="agrid" style=${{"--cell":px+"px", gridTemplateColumns:`repeat(${w},${px}px)`}}>
      ${g.map((row,y)=>row.map((v,x)=>html`<div key=${y+":"+x}
        class=${places && covers(places,y,x) ? "hl" : null}
        style=${{background:ARC[v]}}></div>`))}
    </div>
  </div>`;
}

/* ---------- grid citations ---------- */
/* A place from a chip's citation text: a point carries both axes; a rows or
   cols spec carries one, and a cols spec directly after a rows-only place
   intersects with it (the corpus's box form) instead of starting a band. */
function parsePlaces(s){
  const out=[];
  for(const m of s.matchAll(/\(\s*(\d+)\s*,\s*(\d+)\s*\)|(rows?|cols?|columns?) ?(\d+)(?: ?[–-] ?(\d+))?/g)){
    if(m[1]!==undefined){ out.push({r0:+m[1], r1:+m[1], c0:+m[2], c1:+m[2]}); continue; }
    const a=+m[4], b=m[5]===undefined ? a : +m[5], prev=out[out.length-1];
    if(m[3][0]==="r") out.push({r0:a, r1:b});
    else if(prev && prev.c0===undefined){ prev.c0=a; prev.c1=b; }
    else out.push({c0:a, c1:b});
  }
  return out;
}
const covers=(ps,r,c)=>ps.some(p=>
  (p.r0===undefined || (r>=p.r0 && r<=p.r1)) &&
  (p.c0===undefined || (c>=p.c0 && c<=p.c1)));

function CitePop({cite, task, onClose}){
  const m=/^(train|test)(\d)$/.exec(cite.pair);
  const grid=(task && typeof task!=="string" && (task[m[1]]||[])[+m[2]] || {})[cite.side];
  const places=useMemo(()=>parsePlaces(cite.places),[cite.places]);
  const oob=grid ? places.filter(p=>(p.r0??0)>grid.length-1 || (p.c0??0)>grid[0].length-1) : [];
  const style={left:Math.max(8, Math.min(cite.x, window.innerWidth-360))+"px",
               top:Math.max(8, Math.min(cite.y+6, window.innerHeight-320))+"px"};
  return html`<div id="citepop" style=${style}>
    <div class="cphead">${cite.tid} · ${cite.pair} ${cite.side}
      ${cite.pinned && html`<button class="cpx" onClick=${onClose}>×</button>`}</div>
    ${!task || task==="pending" ? html`<div class="cpnote">loading…</div>`
      : task==="missing" ? html`<div class="cpnote">no task data</div>`
      : !grid ? html`<div class="cpnote">no ${cite.pair} ${cite.side} in this task</div>`
      : html`<${Grid} g=${grid} places=${places}/>`}
    ${oob.length>0 && html`<div class="cpnote">cited place outside the ${grid.length}×${grid[0].length} grid</div>`}
  </div>`;
}

function Thumb({task}){
  const ref=useRef(null);
  const ok = !!task && typeof task!=="string";
  useEffect(()=>{
    const cv=ref.current;
    if(!cv || !ok) return;
    const g=task.train[0].input;
    const w=g[0].length, h=g.length, px=Math.max(1,Math.floor(30/Math.max(w,h)));
    cv.width=w*px; cv.height=h*px;
    const ctx=cv.getContext("2d");
    g.forEach((row,y)=>row.forEach((v,x)=>{ ctx.fillStyle=ARC[v]; ctx.fillRect(x*px,y*px,px,px); }));
  },[task, ok]);
  return ok ? html`<canvas ref=${ref}></canvas>` : html`<div class="thumb-ph"></div>`;
}

/* ---------- rail ---------- */
function ItemRow({it, sel, task, metric, onSelect}){
  useClock();   // the cache countdown
  const ci=cacheInfo(it);
  const sub = it.est ? "est "+it.est : "";
  return html`<div class=${"row"+(sel?" sel":"")} tabIndex="0"
      onClick=${()=>onSelect(it.id)}
      onKeyDown=${e=>{ if(e.key==="Enter") onSelect(it.id); }}>
    <${Thumb} task=${task}/>
    <div class="meta">
      <div class="tid">
        ${it.id}${" "}
        ${it.updated && html`<span class="badge-upd">UPD</span>`}
        ${it.dirty && html`<span class="badge-dirty">CLEANUP</span>`}
        <${CompBadges} x=${it}/><${CalloutBadge} x=${it}/>
      </div>
      <div class="sub">${sub}</div>
    </div>
    <div class="side">
      <${StateChip} state=${it.state} label=${it.state==="needs-review"?"review":it.state}/>
      <span class=${"ttl "+ci.cls}>${ci.txt}</span>
      <span class=${"phz"+(it.phase==="finalize"?" fin":"")}>${it.phase}</span>
      ${metric!=null && html`<span class="bksz mono">${metric}</span>`}
    </div>
  </div>`;
}

function BkRow({b, sel, task, metric, onSelect}){
  return html`<div class=${"row bk"+(sel?" sel":"")} tabIndex="0"
      onClick=${()=>onSelect(b.id)}
      onKeyDown=${e=>{ if(e.key==="Enter") onSelect(b.id); }}>
    <${Thumb} task=${task}/>
    <div class="meta">
      <div class="tid">
        ${b.id}${" "}
        ${b.no_solver && html`<span class="badge-none"
          title="the pass wrote no solver">no solver</span>`}
        <${CompBadges} x=${b}/><${CalloutBadge} x=${b}/>
      </div>
      <div class="sub mono" title=${(b.passes||[]).map(p=>p.stage+": "+p.model).join("\n")}>${passLabel(b)}</div>
    </div>
    ${metric!=null && html`<div class="side"><span class="bksz mono">${metric}</span></div>`}
  </div>`;
}

function Rail({view, items, itemOrder, itemTotal, onMoreItems, finRows,
               backlog, bkTotal, onMore, bkOrder, setBkOrder,
               selId, selIsItem, tasks, onSelect}){
  const fin = view===FINAL;
  const row = id => {
    const it=items.find(x=>x.id===id);
    return html`<${ItemRow} key=${id} it=${it} task=${tasks[id]}
      metric=${fin ? sizeOf(finRows[id]||{}, bkOrder) : null}
      sel=${selIsItem && id===selId} onSelect=${onSelect}/>`;
  };
  return html`<nav id="rail" aria-label="wave items">
    <div class="railhead">
      <span>${fin ? "finalizing · "+itemOrder.length : "cache ↑expiring"}</span>
      ${fin && html`<span class="bktog">${Object.keys(BK_ORDERS).map(k=>html`<button key=${k}
        class=${bkOrder===k?"on":""} title=${BK_ORDERS[k]}
        onClick=${()=>setBkOrder(k)}>${k==="flag"?"flag ↑":k==="passes"?"passes":k+" ↓"}</button>`)}</span>`}
    </div>
    ${itemOrder.map(row)}
    ${!fin && itemTotal>itemOrder.length && html`<button class="bkmore" onClick=${onMoreItems}>
      ${"show all "+itemTotal}</button>`}
    ${fin && html`<div class="railhead"><span>${"unfinalized · "+bkTotal}</span></div>`}
    ${fin && backlog.map(b=>html`<${BkRow} key=${b.id} b=${b} task=${tasks[b.id]}
      metric=${sizeOf(b, bkOrder)}
      sel=${b.id===selId && !itemOrder.includes(b.id)} onSelect=${onSelect}/>`)}
    ${fin && bkTotal>backlog.length && html`<button class="bkmore" onClick=${onMore}>
      ${"show all "+bkTotal}</button>`}
  </nav>`;
}

/* ---------- top bar ---------- */
/* account rate-limit windows, statusline style: 5h➞1pm 40%/62% */
function resetLabel(epoch, weekly){
  const d=new Date(Math.round(epoch/1800)*1800*1000);
  const h=d.getHours(), m=d.getMinutes(), ap=h>=12?"pm":"am", h12=h%12||12;
  const t=m ? h12+":"+String(m).padStart(2,"0")+ap : h12+ap;
  return weekly ? ["sun","mon","tue","wed","thu","fri","sat"][d.getDay()]+","+t : t;
}
function Usage({usage}){
  useClock();   // the pace target moves with the time left in a window
  return html`<span id="usage">${usage.map((w,i)=>{
    const cls = w.pct>=70?"uhot":w.pct>=45?"uwarn":"uok";
    let txt = w.label;
    if(w.reset) txt += "➞"+resetLabel(w.reset, w.window>6*86400);
    txt += " "+Math.floor(w.pct)+"%";
    if(w.reset){
      const target=Math.max(0,Math.min(100,Math.round(100*(1-(w.reset-Date.now()/1000)/w.window))));
      txt += "/"+target+"%";
    }
    return html`<span key=${w.label+i} class=${cls}>${txt}</span>`;
  })}</span>`;
}

function Topbar({view, setView, wave, items, progress, usage, night, nightOpen, toggleNight,
                 committer, commitOpen, toggleCommit, onCommit, waveCtl,
                 pipeline, models, onPipeline, auto, onAuto}){
  const tally={};
  items.forEach(it=>tally[it.state]=(tally[it.state]||0)+1);
  const gate = (night||{}).gate;
  const nightCls = night && night.on ? (gate&&gate.open?"on":"held") : "";
  const nightTxt = night && night.on
    ? `autopilot ${night.live||0}/${night.target} · ${gate&&gate.open?"open":"held"}`
    : "autopilot";
  return html`<div id="topbar">
    <span class="wordmark"><b>arc</b> · solver console</span>
    <span class="viewtog">
      <button class=${view!==FINAL?"on":""} onClick=${()=>setView("wave")}>wave</button>
      <button class=${view===FINAL?"on":""} onClick=${()=>setView(FINAL)}>finalize</button>
    </span>
    <span class="chip queued mono">${"wave "+pad2(wave)}</span>
    <span class="chip queued mono" hidden=${!progress}>
      ${progress ? progress.solved+"/"+progress.total+" solvers" : ""}
    </span>
    <span id="counts">${STATES.filter(st=>tally[st]).map(st=>html`
      <${StateChip} key=${st} state=${st} label=${tally[st]+" "+(st==="needs-review"?"to review":st)}/>`)}
    </span>
    <button id="commitbtn" class=${committer.running?"on":""}
      hidden=${!committer.running && !(committer.feed||[]).length}
      title="what the committer session says and runs" onClick=${toggleCommit}>
      ${committer.running?"committing…":"committer"}</button>
    <button id="nightbtn" class=${nightCls} onClick=${toggleNight}>${nightTxt}</button>
    <${Usage} usage=${usage}/>
    <span class="wavectl" title="the models the next wave's stages run">
      ${Object.keys(pipeline).map(name=>html`<label key=${name}>${name}
        <select aria-label=${name+" model"} value=${pipeline[name]}
          onChange=${e=>onPipeline(name, e.target.value)}>
          ${models.map(m=>html`<option key=${m} value=${m}>${m}</option>`)}
        </select></label>`)}
    </span>
    <span class="wavectl">
      <label title="a landing whose next stage is finalize hands on by itself">
        <input type="checkbox" checked=${!!auto.finalize}
          onChange=${e=>onAuto("finalize", e.target.checked)}/>auto finalize</label>
      <label title="compact an unapproved finalize session before its cache goes cold or its worker is reaped">
        <input type="checkbox" checked=${!!auto.compact}
          onChange=${e=>onAuto("compact", e.target.checked)}/>auto compact</label>
    </span>
    <span class="wavectl" title="start the next wave">wave
      <input type="number" min="1" max="20" aria-label="wave size"
        value=${waveCtl.k} onInput=${e=>waveCtl.setK(e.target.value)}/>
      <select aria-label="wave order" value=${waveCtl.order} onChange=${e=>waveCtl.setOrder(e.target.value)}>
        <option value="name">name order</option>
        <option value="size">simplest</option>
      </select>
      <button disabled=${waveCtl.busy} onClick=${waveCtl.start}>start</button>
    </span>
    <button class="primary" disabled=${!items.some(it=>it.state==="approved")}
      onClick=${onCommit}>commit approved</button>
  </div>`;
}

/* ---------- overnight ----------
   The dials are the server's; the panel only mirrors them, so an edit posts
   and the next poll confirms it. A field the user is typing in is left alone. */
const NIGHT_DIALS = ["target","reserve","floor","ceiling"];
const hhmm = e => { const d=new Date(e*1000);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };

function NightPanel({night, open, onDial, onToggle, onCatchup}){
  const n = night||{}, g = n.gate;
  const refs = {target:useRef(null), reserve:useRef(null), floor:useRef(null), ceiling:useRef(null)};
  const log = useRef(null), onBox = useRef(null), catchBox = useRef(null);
  useEffect(()=>{
    for(const key of NIGHT_DIALS){
      const el=refs[key].current, v=n[key];
      if(el && v!=null && document.activeElement!==el && el.value!==String(v)) el.value=v;
    }
    /* the boxes mirror the server, so a click the server does not confirm —
       a declined autopilot prompt — snaps back on the next draw */
    if(onBox.current) onBox.current.checked=!!n.on;
    if(catchBox.current) catchBox.current.checked=!!n.catchup;
    if(log.current) log.current.scrollTop=log.current.scrollHeight;
  });
  const read=[];
  if(g && g.wk!=null && g.line!=null)
    read.push(html`<span key="wk">wk <b>${g.wk.toFixed(1)+"%"}</b> vs line <b>${g.line.toFixed(1)+"%"}</b>
      ${" (elapsed "+g.elapsed.toFixed(1)+"% − reserve "+n.reserve+")"}</span>`);
  if(g && g.fiveh!=null)
    read.push(html`<span key="5h">5h <b>${g.fiveh.toFixed(1)+"%"}</b>${" / ceiling "+n.ceiling+"%"}
      ${g.squeeze && html`<span> · <b>squeeze zone</b></span>`}</span>`);
  if(g) read.push(html`<span key="gate" class=${g.open?"gate-open":"gate-held"}>
    ${(g.open?"admission open · ":"admission held · ")+g.why}</span>`);
  else read.push(html`<span key="off">admissions are yours</span>`);
  if(n.next) read.push(html`<span key="next">${"next: "+n.next.what+" "+hhmm(n.next.at)}</span>`);
  return html`<div id="nightpanel" hidden=${!open}>
    <div class="nightrow">
      <label title="run the queue unattended">
        <input ref=${onBox} type="checkbox" checked=${!!n.on}
          onChange=${e=>onToggle(e.target.checked)}/>
        <b>autopilot</b></label>
      <label title="items kept in flight">target
        <input ref=${refs.target} type="number" min="1" max="40"
          onChange=${e=>onDial("target", e.target.value)}/></label>
      <label title="weekly points held back from the pace line">reserve
        <input ref=${refs.reserve} type="number" min="0" max="100"
          onChange=${e=>onDial("reserve", e.target.value)}/></label>
      <label title="weekly points free to spend early in the week">floor
        <input ref=${refs.floor} type="number" min="0" max="100"
          onChange=${e=>onDial("floor", e.target.value)}/></label>
      <label title="5h utilization above which new admissions hold">5h ceiling
        <input ref=${refs.ceiling} type="number" min="0" max="100"
          onChange=${e=>onDial("ceiling", e.target.value)}/></label>
      <label title="spend the week's slack">
        <input ref=${catchBox} type="checkbox" checked=${!!n.catchup}
          onChange=${e=>onCatchup(e.target.checked)}/>
        catchup</label>
      <span style="flex:1"></span>
      <span><b>${n.landed||0}</b> landed unreviewed tonight</span>
    </div>
    <div class="nightrow">${read}</div>
    <div id="nightlog" ref=${log}>
      ${(n.log||[]).map((e,i)=>html`<div key=${i+":"+e.t}>${hhmm(e.t)+" · "+e.text}</div>`)}
    </div>
  </div>`;
}

/* ---------- committer panel ----------
   What the committer session says and runs, as the server streams it. The
   feed stays up after the run, until the next commit starts one. */
function CommitPanel({committer, open}){
  const c=committer||{}, box=useRef(null);
  useEffect(()=>{ if(box.current) box.current.scrollTop=box.current.scrollHeight; });
  const rows=feedBlocks(c.feed||[]).map(b=>b.tools
    ? html`<div class="tools" key=${b.key}>${b.tools.map((m,i)=>html`<${ToolLine} key=${i} m=${m}/>`)}</div>`
    : html`<${Entry} key=${b.key} m=${b.m}/>`);
  return html`<div id="commitpanel" hidden=${!open}>
    <div id="commitfeed" ref=${box}>
      ${rows}
      ${c.running ? html`<p class="placeholder"><span class="runpulse"></span>${
          "committer running"+(c.started?" · since "+hhmm(c.started):"")}</p>` : null}
    </div>
  </div>`;
}

/* ---------- feed ----------
   Entries are keyed by position, so a streaming turn appends and the rows
   already on screen stay put. Consecutive tool lines share one group. */
function feedBlocks(entries){
  const out=[];
  entries.forEach((m,i)=>{
    if(m.kind==="tool"){
      const last=out[out.length-1];
      if(last && last.tools) last.tools.push(m);
      else out.push({key:i, tools:[m]});
    } else out.push({key:i, m});
  });
  return out;
}
function Entry({m}){
  if(m.kind==="report")
    return html`<section class="report"><div class="body"
      dangerouslySetInnerHTML=${{__html:md(m.text)}}></div></section>`;
  if(m.kind==="event")
    return html`<div class="event">${"— "+m.text+" —"}</div>`;
  if(m.kind==="ask")
    return html`<div class="msg ask" dangerouslySetInnerHTML=${{__html:md(m.text)}}></div>`;
  const bubble = m.kind==="you" ? "you" : m.kind==="steer" ? "steer" : "worker";
  return html`<div class=${"msg "+bubble+(m.sub?" sub":"")}
    dangerouslySetInnerHTML=${{__html:md(m.text)}}></div>`;
}
function ToolLine({m}){
  const sp=m.text.indexOf(" ");
  return html`<div class=${"tl"+(m.sub?" sub":"")}>${
    sp<0 ? html`<b>${m.text}</b>`
         : [html`<b key="h">${m.text.slice(0,sp)}</b>`, " "+m.text.slice(sp+1)]}</div>`;
}

function Feed({it, entries, feedKey, showRun}){
  const box=useRef(null), stick=useRef(true), lastKey=useRef(null);
  useClock();   // the running-turn timer
  const now=Date.now()/1000;
  /* measured against the DOM as it stands before this render commits, the way
     a hand-written append would: at the bottom now means at the bottom after */
  if(lastKey.current!==feedKey) stick.current=true;
  else if(box.current){
    const js=box.current;
    stick.current = js.scrollHeight - js.scrollTop - js.clientHeight < 60;
  }
  useLayoutEffect(()=>{
    lastKey.current=feedKey;
    if(stick.current && box.current) box.current.scrollTop=box.current.scrollHeight;
  });
  const rows=useMemo(()=>feedBlocks(entries).map(b=>b.tools
    ? html`<div class="tools" key=${b.key}>${b.tools.map((m,i)=>html`<${ToolLine} key=${i} m=${m}/>`)}</div>`
    : html`<${Entry} key=${b.key} m=${b.m}/>`), [entries]);
  return html`<div id="judge-scroll" ref=${box}>
    <div id="feed" data-tid=${it.id}>
      ${rows}
      ${showRun
        ? html`<p class="placeholder"><span class="runpulse"></span>worker running${
            it.turnStarted ? html`<span> · <span>${fmtDur(now-it.turnStarted)}</span></span>` : ""}</p>`
        : !entries.length
        ? html`<p class="placeholder">${it.state==="queued"?"queued":"no messages yet"}</p>`
        : null}
    </div>
  </div>`;
}

/* ---------- detail header ---------- */
function DetailHead({it, cli, tab, badges, canAdvance, canResume, nxt, onTab, onDismiss}){
  const sid=it.sessions[tab];
  const context=(it.context||{})[tab];
  const resume = backendOf(it,tab)==="codex" ? "codex exec resume" : "claude --resume";
  return html`<div>
    <div class="dhead">
      <span class="tid">${it.id}</span>
      <${StateChip} state=${it.state}/>
      <span class="chip queued"><span class="dot"></span>${stageLabel(it,it.phase)}</span>
      ${it.updated && html`<span class="badge-upd">UPDATED</span>`}
      ${it.dirty && html`<span class="badge-dirty">CLEANUP PENDING</span>`}
      <${CompBadges} x=${it}/><${CalloutBadge} x=${it}/>
    </div>
    <div class="stabs">
      ${stageNames(it).filter(s=>hasTab(it,s)).map(s=>html`
        <span key=${s} class=${"stab"+(s===tab?" on":"")} onClick=${()=>onTab(s)}>
          ${stageLabel(it,s)}${badges[s] && html`<span class="bdg"></span>`}
        </span>`)}
    </div>
    ${/* The turn buttons lead, on a fixed-width command. The readouts and the
          two conveniences trail, since a growing context figure and a worker
          the console reaped mid-session both move whatever follows them. */
      sid && html`<div class="sessline">
      <span class="cmd">${resume+" "+sid.slice(0,8)+"…"}</span>
      ${canResume && html`
        <button class="copybtn" title="continue the turn a usage limit cut off"
          onClick=${()=>post("/api/resume",{id:it.id})}>resume</button>`}
      ${canAdvance && html`
        <button class="copybtn" title="hand the report on"
          onClick=${()=>post("/api/advance",{id:it.id})}>${"advance · "+stageLabel(it,nxt)}</button>`}
      ${canAdvance && nxt==="finalize" && html`
        <button class="copybtn" title="record that no finalize pass is needed"
          onClick=${()=>onDismiss(it.id)}>✕ dismiss</button>`}
      ${it.active
        ? html`<button class="copybtn" onClick=${()=>post("/api/kill",{id:it.id})}>stop</button>`
        : html`<button class="copybtn" onClick=${()=>{
            if(confirm("Drop "+it.id+" from the console?")) post("/api/drop",{id:it.id});
          }}>drop</button>`}
      ${context && html`<span>${"context "+context.percent.toFixed(1)+"%"}</span>`}
      ${/* a codex stage reports no context window and compacts its own thread;
            `/compact` would reach it as prompt text, so the button stays off */
        context && backendOf(it,tab)!=="codex" && html`
        <button class="copybtn" disabled=${it.active}
          onClick=${()=>post("/api/compact",{id:it.id,sess:tab})}>
          ${"compact · "+(context.compactPct==null
            ? Math.round(context.used/1000)+"k rewrite"
            : "~"+context.compactPct.toFixed(2)+"% "+context.limiting)}</button>`}
      ${!(it.workerLive||{})[tab] && html`
        <button class="copybtn"
          onClick=${()=>copy(takeoverCmd(it,tab,cli),"takeover "+it.id)}>copy · o</button>`}
    </div>`}
  </div>`;
}

function PeekHead({d, onDismiss, onApprove}){

/* ---------- composer ---------- */
function Composer({boxRef, enabled, canSend, placeholder, hint, value, onInput, onSend}){

/* ---------- task strip + code column ---------- */
function TaskStrip({id, task, open, onToggle}){
  const body = useMemo(()=>{
    if(!task || typeof task==="string") return null;
    return html`<div class="gridwell"><div class="pairrow">
      ${task.train.map((p,i)=>html`<div class="pair" key=${"tr"+i}>
        <${Grid} g=${p.input} label=${"train "+i}/>
        <span class="arr">→</span>
        <${Grid} g=${p.output} label="out"/>
      </div>`)}
      ${task.test.map((p,i)=>html`<div class="pair" key=${"te"+i}>
        <${Grid} g=${p.input} label=${"test "+i}/>
        ${p.output && [html`<span class="arr" key="a">→</span>`,
                       html`<${Grid} key="g" g=${p.output} label="expected"/>`]}
      </div>`)}
    </div></div>`;
  },[task, id]);
  const label = task && typeof task!=="string"
    ? "task · "+task.train.length+" train / "+task.test.length+" test" : "task";
  return html`<div id="taskstrip" class=${open?"open":""}>
    <div class="taskhead" onClick=${onToggle}>
      <span class="caret">▸</span><span>${label}</span><span style="margin-left:auto">t</span>
    </div>
    <div id="taskbody">${body}</div>
  </div>`;
}

function CodePane({jumpKey, fname, lines, buttons, pane}){
  const pre=useRef(null);
  /* A long file's edits are rarely at the top, so bring the first marked line
     into view. Only when the pane switches to a different file: re-running this
     as a turn streams would drag the pane away from whoever is reading it. */
  useLayoutEffect(()=>{
    const el=pre.current;
    if(!el) return;
    const first=el.querySelector(".add, .del");
    if(!first){ el.scrollTop=0; return; }
    const lead=(parseFloat(getComputedStyle(el).lineHeight)||0)*3;   // lines of lead-in
    el.scrollTop += first.getBoundingClientRect().top - el.getBoundingClientRect().top - lead;
  },[jumpKey]);
  return [
    html`<div class="codehead" key="h">
      <span class="fname">${fname}</span>
      <span id="flines">${lines}</span>
      <span id="codebtns" style="margin-left:auto">${buttons}</span>
    </div>`,
    html`<pre id="codepre" key="p" ref=${pre} dangerouslySetInnerHTML=${{__html:pane}}></pre>`,
  ];
}

/* ---------- app ---------- */
function App(){
  const snap=useServer();
  const [selId,setSelId]=useState(null);
  const [view,setViewState]=useState(()=>localStorage.getItem("view")===FINAL?FINAL:"wave");
  const [backlog,setBacklog]=useState([]);
  const [finRows,setFinRows]=useState({});   // id -> lens row of a finalize pass in flight
  const [bkAll,setBkAll]=useState(false);   // every unfinalized row, on the user's ask
  const [railAll,setRailAll]=useState(false);   // every wave row, on the user's ask
  const [bkOrder,setBkOrderState]=useState(()=>{
    const v=localStorage.getItem("bkOrder");
    return BK_ORDERS[v] ? v : "flag";
  });
  const [toastState,setToastState]=useState({msg:"", show:false});
  const [sessPin,setSessPin]=useState({});    // id -> {phase, tab} the user pinned
  const [tabSel,setTabSel]=useState({});      // id -> path of the active code tab
  const [taskOpen,setTaskOpen]=useState({});  // id -> bool (default open)
  const [draft,setDraft]=useState("");
  const [nightOpen,setNightOpen]=useState(()=>!!localStorage.getItem("nightOpen"));
  const [waveK,setWaveK]=useState("10");
  const [waveOrder,setWaveOrder]=useState("name");
  const [commitOpen,setCommitOpen]=useState(()=>!!localStorage.getItem("commitOpen"));
  const [waveBusy,setWaveBusy]=useState(false);
  const [cite,setCite]=useState(null);  // hovered/pinned grid citation

  bindToast(setToastState);

  const seenN=useRef({});       // id|sess -> feed length when that tab was last shown
  const draftFor=useRef(null);  // id whose draft the composer holds
  const cbox=useRef(null);
  const live=useRef({});        // what the async handlers read

  const {items, cli, night, committer, pipeline, models, auto, usage, progress, wave} = snap;

  const fetchBacklog=useCallback(async()=>{
    if(live.current.view!==FINAL) return;
    try {
      const r=await fetch("/api/backlog");
      const d=await r.json();
      const ranked = rows => (rows||[]).map((row,i)=>({...row, triage:i}));
      setBacklog(ranked(d.items));
      setFinRows(Object.fromEntries(ranked(d.finalizing).map(row=>[row.id,row])));
    } catch(e){}
  },[]);

  /* ---- grid citations: hover shows, click pins, esc or click-away closes.
     Chips are static spans out of md(), so one delegated set of listeners
     serves every feed render; the task id rides on the feed container. ---- */
  useEffect(()=>{
    const at=e=>{
      const chip=e.target.closest(".cite"), scope=chip && chip.closest("[data-tid]");
      if(!scope) return null;
      const r=chip.getBoundingClientRect();
      return {tid:scope.dataset.tid, pair:chip.dataset.pair, side:chip.dataset.side,
              places:chip.dataset.places, x:r.left, y:r.bottom};
    };
    const over=e=>{
      const c=at(e);
      if(c){ ensureTask(c.tid); setCite(p=>p && p.pinned ? p : c); }
      else if(!e.target.closest("#citepop")) setCite(p=>p && !p.pinned ? null : p);
    };
    const click=e=>{
      const c=at(e);
      if(c){ ensureTask(c.tid); setCite({...c, pinned:true}); }
      else if(!e.target.closest("#citepop")) setCite(null);
    };
    const key=e=>{ if(e.key==="Escape") setCite(null); };
    document.addEventListener("mouseover",over);
    document.addEventListener("click",click);
    document.addEventListener("keydown",key);
    return ()=>{
      document.removeEventListener("mouseover",over);
      document.removeEventListener("click",click);
      document.removeEventListener("keydown",key);
    };
  },[]);

  /* ---- selection ---- */
  /* soonest-expiring cache first; a phase with no session yet, or a turn that
     never landed, leads with "—"; running turns follow; cold ones close by state */
  const railOrder=useClocked(()=>
    [...items].sort((a,b)=>cacheInfo(a).sort-cacheInfo(b).sort).map(it=>it.id),
    [items]);
  /* An approved or committed item is settled, so the finalize lens gives its
     row back; the wave view still lists it, cut to the first rows until asked
     for the rest. The selected one stays, so a row does not vanish from under
     the detail pane while it is being read. In the lens, a session with a
     cache to keep warm leads in cache order; the cold ones follow in the
     chosen ordering, over the rows the server sent for them. */
  const itemOrder=useClocked(()=>{
    if(view===FINAL){
      const rows=railOrder.map(id=>items.find(x=>x.id===id)).filter(it=>
        it && it.phase===FINAL && (it.id===selId || !SETTLED.includes(it.state)));
      const cmp=bkCmp(bkOrder), rowOf=it=>finRows[it.id]||{id:it.id};
      return rows.filter(it=>cacheInfo(it).cls!=="cold")
        .concat(rows.filter(it=>cacheInfo(it).cls==="cold").sort((a,b)=>cmp(rowOf(a), rowOf(b))))
        .map(it=>it.id);
    }
    if(railAll || railOrder.length<=RAIL_SHOWN) return railOrder;
    const shown=railOrder.slice(0, RAIL_SHOWN);
    return railOrder.includes(selId) && !shown.includes(selId) ? shown.concat([selId]) : shown;
  }, [railOrder, items, view, selId, railAll, bkOrder, finRows]);
  /* the rows arrive in triage order; the other orderings resort them here */
  const bkSorted=useMemo(()=>[...backlog].sort(bkCmp(bkOrder)), [backlog, bkOrder]);
  const bkShown=useMemo(()=>bkAll ? bkSorted : bkSorted.slice(0, BK_SHOWN), [bkSorted, bkAll]);
  /* one selection over both sections: in-pass items, then the unfinalized rows
     on show. An id that is both a live item and a row resolves to the item. */
  const curOrder=useMemo(()=>view===FINAL
    ? itemOrder.concat(bkShown.map(b=>b.id).filter(id=>!itemOrder.includes(id)))
    : itemOrder, [itemOrder, bkShown, items, view]);

  const selItem = items.find(it=>it.id===selId) || null;
  const selBk = !selItem && view===FINAL ? (backlog.find(b=>b.id===selId)||null) : null;
  const detailId = selItem ? selItem.id : selBk ? selBk.id : null;

  const select=useCallback(id=>{
    if(!id) return;
    setSelId(id);
    const it=live.current.items.find(x=>x.id===id);
    ensureTask(id);
    if(it){
      ensureItem(id, true);
      if(it.updated) post("/api/seen",{id});
    } else {
      ensurePeek(id);
    }
  },[]);

  const setView=useCallback(v=>{
    setViewState(cur=>{
      if(cur===v) return cur;
      localStorage.setItem("view", v);
      return v;
    });
  },[]);
  const setBkOrder=useCallback(v=>{
    localStorage.setItem("bkOrder", v);
    setBkOrderState(v);
  },[]);

  /* ---- the session tab in view: the user's pin while it holds, else the stage ---- */
  const tabOf=useCallback(it=>{
    const pin=sessPin[it.id];
    const t = pin && pin.phase===it.phase ? pin.tab : null;
    return t && (it.sessions[t]||it.phase===t) ? t : it.phase;
  },[sessPin]);
  const pinTab=useCallback((it,s)=>setSessPin(p=>({...p, [it.id]:{phase:it.phase, tab:s}})),[]);

  const tab = selItem ? tabOf(selItem) : null;
  const cache = (selItem && itemData[selItem.id]) || NO_ITEM;
  const feedFor = s => (cache.feed||[]).filter(m=>(m.sess||"refine")===s);
  /* the entries hold their identity between fetches, so the second-by-second
     redraw for the countdowns leaves the feed alone */
  const entries = useMemo(()=>selItem?feedFor(tab):[], [cache, tab, selItem]);
  const tabBadges = {};
  if(selItem) for(const n of stageNames(selItem))
    tabBadges[n] = n!==tab && hasTab(selItem,n)
      && feedFor(n).length>(seenN.current[selItem.id+"|"+n]||0);
  useEffect(()=>{
    if(selItem) seenN.current[selItem.id+"|"+tab]=entries.length;
  });

  const nxt = selItem ? nextName(selItem) : null;
  const canAdvance = !!(selItem && nxt && !selItem.active && selItem.hasReport
    && (selItem.state==="needs-review"||selItem.state==="approved"));
  const canResume = !!(selItem && selItem.cutPhase === tab && !selItem.active);
  const canSend = !!(selItem && selItem.sessions[tab]
    && !selItem.handoffPending && selItem.state!=="committed");

  /* ---- actions ---- */
  const nextReview=useCallback(()=>{
    const st=live.current;
    const revs=st.railOrder.filter(id=>{
      const it=st.items.find(x=>x.id===id);
      return it && it.state==="needs-review" && id!==st.selId; });
    if(revs.length) select(revs[0]); else toast("review queue empty");
  },[select]);
  const approve=useCallback(async()=>{
    const it=live.current.selItem;
    if(!it||it.state!=="needs-review"){ toast("nothing to approve"); return; }
    const r=await post("/api/approve",{id:it.id});
    if(r.ok){ toast(it.id+" approved"); nextReview(); }
  },[nextReview]);
  const unapprove=useCallback(async()=>{
    const it=live.current.selItem;
    if(!it||it.state!=="approved"){ toast("not approved"); return; }
    const r=await post("/api/unapprove",{id:it.id});
    if(r.ok) toast(it.id+" back to review");
  },[]);
  const sendComment=useCallback(async()=>{
    const st=live.current, it=st.selItem, text=(st.draft||"").trim();
    if(!it||!text) return;
    if(!st.canSend){
      toast(it.handoffPending ? "handoff in flight — draft kept"
        : "no session yet — draft kept");
      return;
    }
    const low=text.toLowerCase();
    if(low==="commit"){ toast("commit is a console action"); return; }
    if(low==="next"){ toast("no next in batch mode"); return; }
    const r=await post("/api/comment",{id:it.id, text, sess:st.tab});
    if(r.ok){
      setDraft(""); localStorage.removeItem(draftKey(it.id));
      if(cbox.current) cbox.current.blur();
      toast((it.busy||{})[st.tab] ? "sent into the running turn" : "sent");
    }
  },[]);
  const commitApproved=useCallback(async()=>{
    const r=await post("/api/commit");
    if(r.ok) toast('git commit -m "'+r.msg+'"');
  },[]);
  const toggleTask=useCallback(()=>{
    const id=live.current.detailId;
    if(!id) return;
    setTaskOpen(o=>({...o, [id]: !(o[id]!==false)}));
  },[]);

  const startWave=useCallback(async()=>{
    const st=live.current;
    if(st.waveBusy) return;
    setWaveBusy(true);
    try {
      const k=parseInt(st.waveK,10)||6;
      const r=await post("/api/wave",{k, order:st.waveOrder});
      if(r.ok) toast("wave started · "+r.ids.join(", "));
    } finally {
      setTimeout(()=>setWaveBusy(false), 5000);   // matches WAVE_DEBOUNCE
    }
  },[]);
  /* the setting is the server's; the select mirrors it, and the next poll
     confirms an edit */
  const onPipeline=useCallback(async(name, word)=>{
    const r=await post("/api/pipeline",{[name]:word});
    if(r.ok) toast(name+" runs "+word+" from the next wave");
  },[]);
  const onAuto=useCallback(async(name, on)=>{
    const r=await post("/api/auto",{[name]:on});
    if(r.ok) toast("auto "+name+(on?" on":" off"));
  },[]);

  const onDismiss=useCallback(async id=>{
    if(!confirm("Dismiss "+id+"? A ledger line records that it needs no finalize pass.")) return;
    await post("/api/dismiss",{id});
    fetchBacklog();
  },[fetchBacklog]);
  const onApprove=useCallback(async id=>{
    if(!confirm("Approve "+id+"? A ledger line records the ruling.")) return;
    await post("/api/approve-solver",{id});
    fetchBacklog();
  },[fetchBacklog]);

  const postNight=useCallback(async(body, note)=>{
    const r=await post("/api/night", body);
    if(r.ok && note) toast(note);
  },[]);
  const onNightToggle=useCallback(on=>{
    if(on){
      const n=live.current.night||{};
      const ok=confirm("Autopilot admits tasks from the queue: up to "
        +(n.target??6)+" items in flight, create → refine"
        +((live.current.auto||{}).finalize?" → finalize":"")+", "
        +"within ~30s of the pacer opening. Start?");
      if(!ok){ notify(); return; }   // the checkbox mirrors the server, so redraw it
    }
    postNight({on}, on?"autopilot on":"autopilot off");
  },[postNight]);

  /* ---- what the async handlers read ---- */
  live.current = {items, selId, selItem, detailId, tab, draft, canSend, view, auto,
                  railOrder, curOrder, night, waveK, waveOrder, waveBusy};

  /* ---- a server change: the selected item's turn may have landed, and a
     landing writes the ledger line the backlog reads ---- */
  useEffect(()=>{
    if(!snap.seq) return;
    const have=selItem && itemData[selItem.id];
    if(selItem && (!have || have.ver!==selItem.ver)) ensureItem(selItem.id, true);
    fetchBacklog();
  },[snap.seq]);

  /* ---- timers ---- */
  useEffect(()=>onTick(()=>ttlWatch(live.current.items)),[]);
  /* the scan stats every solver, so it is polled only while its lens is
     open, and slowly: flags and started passes refresh it on the spot */
  useEffect(()=>{
    const h=setInterval(fetchBacklog, 15000);
    return ()=>clearInterval(h);
  },[fetchBacklog]);

  /* ---- view side effects ---- */
  useEffect(()=>{
    document.body.classList.toggle("view-final", view===FINAL);
    if(view===FINAL) fetchBacklog();
    else { setBacklog([]); setFinRows({}); setBkAll(false); }
  },[view, fetchBacklog]);

  /* ---- selection stays on something that exists ---- */
  useEffect(()=>{
    let id=selId;
    if(id && !items.some(x=>x.id===id)
       && !(view===FINAL && backlog.some(b=>b.id===id))) id=null;
    if(!id) id = curOrder[0] || (items.length ? railOrder[0] : null) || null;
    if(id!==selId){
      setSelId(id);
      if(id){
        const it=items.find(x=>x.id===id);
        ensureTask(id);
        if(it) ensureItem(id); else ensurePeek(id);
      }
    }
  },[items, backlog, view, curOrder, railOrder, selId]);

  /* ---- the rows on screen want their thumbnails ---- */
  useEffect(()=>{
    for(const id of curOrder) ensureTask(id);
    if(detailId) ensureTask(detailId);
  },[curOrder, detailId]);

  /* ---- per-item comment drafts ---- */
  useEffect(()=>{
    const id = selItem ? selItem.id : null;
    if(draftFor.current===id) return;
    draftFor.current=id;
    setDraft(id ? (localStorage.getItem(draftKey(id))||"") : "");
  },[selItem]);
  const onDraft=useCallback(v=>{
    setDraft(v);
    const id=draftFor.current;
    if(!id) return;
    if(v) localStorage.setItem(draftKey(id), v);
    else localStorage.removeItem(draftKey(id));
  },[]);

  /* ---- keys ---- */
  const keyRef=useRef(null);
  keyRef.current=e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    /* type-ahead in a select, and every key a field of its own reads */
    const inBox = e.target===cbox.current
      || ["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName);
    if(e.key==="Escape"){ if(inBox) e.target.blur(); return; }
    if(inBox){
      if(e.target===cbox.current && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendComment(); }
      return;
    }
    const order=live.current.curOrder, pos=order.indexOf(live.current.selId);
    if(e.key==="j"){ if(order.length) select(order[Math.min(pos+1,order.length-1)]); }
    else if(e.key==="k"){ if(order.length) select(order[Math.max(pos-1,0)]); }
    else if(e.key==="n"){ nextReview(); }
    else if(e.key==="a"){ approve(); }
    else if(e.key==="u"){ unapprove(); }
    else if(e.key==="c"){ if(cbox.current && !cbox.current.disabled){ e.preventDefault(); cbox.current.focus(); } }
    else if(e.key==="o"){
      const it=live.current.selItem;
      if(it){ const s=live.current.tab;
        if(it.sessions[s] && !(it.workerLive||{})[s]) copy(takeoverCmd(it,s,cli),"takeover "+it.id); }
    }
    else if(e.key==="s"){
      const it=live.current.selItem;
      if(it){ const ns=stageNames(it).filter(n=>hasTab(it,n));
        if(ns.length>1) pinTab(it, ns[(ns.indexOf(live.current.tab)+1)%ns.length]); }
    }
    else if(e.key==="t"){ toggleTask(); }
    else if(e.key==="v"){ setView(live.current.view===FINAL?"wave":FINAL); }
  };
  useEffect(()=>{
    const h=e=>keyRef.current(e);
    document.addEventListener("keydown", h);
    return ()=>document.removeEventListener("keydown", h);
  },[]);

  /* ---- code pane ---- */
  const files = cache.files || [];
  const f = files.find(x=>x.path===(selItem?tabSel[selItem.id]:null)) || files[0]
    || {path:"", snap:"", code:""};
  const codeBuilt = useMemo(()=>{
    if(!f.code) return {html:"", added:0, removed:0};
    if(f.snap && f.snap!==f.code && window.Diff) return diffHtml(f.snap, f.code);
    return {html:cmify(f.code), added:0, removed:0};
  },[f.path, f.snap, f.code]);
  const peek = selBk ? peeks[selBk.id] : null;
  const peekPane = useMemo(()=>peek?esc(peek.solver):"", [peek]);

  let fname="—", flines="", pane="", codeBtns=null, jumpKey="";
  if(selItem){
    const turn=[codeBuilt.added?"+"+codeBuilt.added:"", codeBuilt.removed?"−"+codeBuilt.removed:""]
      .filter(Boolean).join(" ");
    flines = f.code ? f.code.split("\n").length+" lines"+(turn?" · "+turn+" this turn":"") : "";
    pane = f.code ? codeBuilt.html
      : '<span class="cm">// '+(selItem.state==="queued"?"not started":"no file yet")+"</span>";
    fname = files.length>1
      ? files.map(x=>html`<span key=${x.path} class=${"ftab"+(x.path===f.path?" on":"")}
          onClick=${()=>setTabSel(t=>({...t, [selItem.id]:x.path}))}>${x.path.split("/").pop()}</span>`)
      : (f.code ? f.path : "—");
    const solver=files[0]||{};
    const canRevert = f.path===solver.path && solver.code && solver.snap
      && solver.snap!==solver.code && !selItem.active;
    if(canRevert) codeBtns=html`<button class="copybtn"
      onClick=${()=>post("/api/revert",{id:selItem.id})}>revert edits</button>`;
    jumpKey = selItem.id+"|"+f.path;
  } else if(peek){
    fname = "programs/solvers/"+peek.id+".dl";
    flines = peek.solver.split("\n").length+" lines";
    pane = peekPane;
    jumpKey = "peek|"+peek.id;
  }

  /* ---- middle column ---- */
  let head=null, body=null;
  if(selItem){
    head=html`<${DetailHead} it=${selItem} cli=${cli} tab=${tab} badges=${tabBadges}
      canAdvance=${canAdvance} canResume=${canResume} nxt=${nxt}
      onTab=${s=>pinTab(selItem,s)}
      onDismiss=${onDismiss}/>`;
    body=html`<${Feed} key="feed" it=${selItem} entries=${entries}
      feedKey=${selItem.id+"|"+tab}
      showRun=${(selItem.busy||{})[tab] || (selItem.active && !selItem.turnPhase)}/>`;
  } else if(selBk){
    head = peek ? html`<${PeekHead} d=${peek} onDismiss=${onDismiss} onApprove=${onApprove}/>` : null;
    body = peek ? html`<${PeekBody} key="peek" d=${peek}/>`
                : html`<div id="judge-scroll" key="peek"></div>`;
  } else {
    body=html`<div id="judge-scroll" key="none">
      <p class="placeholder">${items.length?"select an item":"no items — start a wave"}</p>
    </div>`;
  }

  let hint="";
  if(selItem){
    hint = selItem.state==="needs-review" && selItem.dirty ? "cleanup pending" : "";
    if(nxt && selItem.state==="needs-review" && selItem.sessions[selItem.phase])
      hint = (selItem.hasReport ? `report ready, advance to ${nxt}`
                                : "`handoff` when ready")+(hint?" · "+hint:"");
  }

  return html`
    <${Topbar} view=${view} setView=${setView} wave=${wave} items=${items}
      progress=${progress} usage=${usage} night=${night} nightOpen=${nightOpen}
      committer=${committer} commitOpen=${commitOpen} onCommit=${commitApproved}
      toggleNight=${()=>setNightOpen(o=>{ localStorage.setItem("nightOpen", o?"":"1"); return !o; })}
      toggleCommit=${()=>setCommitOpen(o=>{ localStorage.setItem("commitOpen", o?"":"1"); return !o; })}
      pipeline=${pipeline} models=${models} onPipeline=${onPipeline}
      auto=${auto} onAuto=${onAuto}
      waveCtl=${{k:waveK, setK:setWaveK, order:waveOrder, setOrder:setWaveOrder,
                 busy:waveBusy, start:startWave}}/>
    <${NightPanel} night=${night} open=${nightOpen} onToggle=${onNightToggle}
      onCatchup=${v=>postNight({catchup:v})}
      onDial=${(key,v)=>postNight({[key]:parseInt(v,10)})}/>
    <${CommitPanel} committer=${committer} open=${commitOpen}/>
    <div id="main">
      <${Rail} view=${view} items=${items} itemOrder=${itemOrder}
        itemTotal=${railOrder.length} onMoreItems=${()=>setRailAll(true)}
        backlog=${bkShown} bkTotal=${bkSorted.length} onMore=${()=>setBkAll(true)} finRows=${finRows}
        bkOrder=${bkOrder} setBkOrder=${setBkOrder}
        selId=${selId} selIsItem=${!!selItem} tasks=${tasks}
        onSelect=${select}/>
      <div id="judge">
        <div id="judge-head">${head}</div>
        ${body}
        <${Composer} boxRef=${cbox} enabled=${!!selItem} canSend=${canSend}
          placeholder=${selItem ? (canSend ? ((selItem.busy||{})[tab] ? "sends into the running turn" : "")
                                  : selItem.handoffPending ? "handoff in flight — draft freely" : "no session yet") : ""}
          hint=${hint} value=${selItem?draft:""} onInput=${onDraft} onSend=${sendComment}/>
      </div>
      <div id="codecol">
        <${TaskStrip} id=${detailId} task=${detailId?tasks[detailId]:null}
          open=${detailId ? taskOpen[detailId]!==false : true} onToggle=${toggleTask}/>
        <${CodePane} jumpKey=${jumpKey} fname=${fname} lines=${flines}
          buttons=${codeBtns} pane=${pane}/>
      </div>
    </div>
    <div id="keysbar">
      <span><b>j/k</b> move</span><span><b>n</b> next review</span><span><b>a</b> approve</span>
      <span><b>u</b> unapprove</span><span><b>c</b> comment</span><span><b>⏎</b> send</span><span><b>⇧⏎</b> newline</span>
      <span><b>s</b> session</span><span><b>t</b> task</span><span><b>v</b> lens</span><span><b>o</b> copy resume</span><span><b>esc</b> blur</span>
    </div>
    ${cite && html`<${CitePop} cite=${cite} task=${tasks[cite.tid]}
      onClose=${()=>setCite(null)}/>`}
    <div id="toast" role="status" class=${toastState.show?"show":""}>${toastState.msg}</div>`;
}

startPoll();
render(html`<${App}/>`, document.getElementById("app"));
</script>
</body>
</html>
