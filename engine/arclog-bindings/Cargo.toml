[package]
name = "arclog-bindings"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The bindings expose the core crate's entry points to Python.
arclog = { path = "../arclog" }
# The table of the lib's constructions, which every decode is evaluated with.
arclog-constructions = { path = "../arclog-constructions" }
# The abi3 wheel runs on Python 3.12 and later. The extension-module feature
# is `arclog-py`'s, since an rlib links no Python library either way.
pyo3 = { version = "0.27.2", features = ["abi3-py312"] }
