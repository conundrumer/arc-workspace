# The arclog engine: one Cargo workspace with its four crates, the core
# crate, the lib's constructions, the Python bindings and the binary.

[workspace]
resolver = "3"
members = ["arclog", "arclog-constructions", "arclog-cli", "arclog-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# The profile of the corpus runs: the release profile's optimization, with
# incremental compilation, so a rebuild after an edit compiles again only
# what the edit changed.
[profile.tool]
inherits = "release"
incremental = true
