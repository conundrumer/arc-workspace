# The arclog engine: one Cargo workspace. The core crate, the lib's
# constructions and the Python bindings of the streams export
# (`arclog-bindings`) stand apart from the crates that only the tables export
# runs (`arclog-tables`, `arclog-tables-py`): no crate of the first group
# depends on one of the second, so the compiler refuses a call from the
# streams path into the tables code. `arclog-py` is the extension module that
# maturin builds, and `arclog-cli` the binary.

[workspace]
resolver = "3"
members = ["block-boost", "arclog", "arclog-constructions", "arclog-tables", "arclog-bindings", "arclog-tables-py", "arclog-cli", "arclog-py", "arclog-features", "arclog-features-py", "arclog-encoder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# The profile of the corpus runs: the release profile's optimization, with
# incremental compilation, so a rebuild after an edit compiles again only
# what the edit changed.
[profile.tool]
inherits = "release"
incremental = true
