[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "arclog-features"
version = "0.1.0"
requires-python = ">=3.12"
description = "The TableVector features of the arclog engine, on stored rows"

[tool.maturin]
module-name = "arclog_features"
features = ["extension-module"]
