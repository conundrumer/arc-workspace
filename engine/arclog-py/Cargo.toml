[package]
name = "arclog-py"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The crate is named apart from the core crate it depends on. maturin names
# the Python module `arclog`, as `pyproject.toml` gives.
name = "arclog_py"
crate-type = ["cdylib"]

[features]
# maturin enables this feature, since an extension module links no Python
# library. `cargo build` and `cargo test` build the crate without it.
extension-module = ["pyo3/extension-module"]

[dependencies]
# The bindings of the streams export, and of the tables export, which the
# module's init registers. The init calls these two `register`s alone.
arclog-bindings = { path = "../arclog-bindings" }
arclog-tables-py = { path = "../arclog-tables-py" }
# The abi3 wheel runs on Python 3.12 and later.
pyo3 = { version = "0.27.2", features = ["abi3-py312"] }

[build-dependencies]
# `build.rs` hashes the inputs of the streams bindings' compile (see there).
sha2 = "0.10"
