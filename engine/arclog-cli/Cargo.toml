[package]
name = "arclog-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
# `cargo run -p arclog-cli` runs the subcommands' binary, not `check_one`.
default-run = "arclog-cli"

[dependencies]
# The binary runs the core crate's reader, resolver, checker and evaluator
# over solver files.
arclog = { path = "../arclog" }
# The table of the lib's constructions, which the concept cases and the lib
# comparison's components are evaluated with.
arclog-constructions = { path = "../arclog-constructions" }
# The tables of a decode's steps, which `tables` counts and `row-counts`
# marks the relations without.
arclog-tables = { path = "../arclog-tables" }
# The JSON of the Souffle snapshot and of `souffle_parity.py rerun --json`,
# which `compare`, `speed`, `check-diff` and `select` read, and of the files
# of `lib-compare` and `row-counts`, which a Python program reads
# or a later one will.
serde_json = "1.0.154"
# The typed form of a rows file (`row_parity`), which is read one case at a
# time from a stream.
serde = { version = "1", features = ["derive"] }
