[package]
name = "arclog-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
# `cargo run -p arclog-cli` runs the subcommands' binary, not `check_one`.
default-run = "arclog-cli"

[dependencies]
# The binary runs the core crate's reader, resolver, checker and evaluator
# over solver files.
arclog = { path = "../arclog" }
# The table of the lib's constructions, which the concept cases and the lib
# comparison's components are evaluated with.
arclog-constructions = { path = "../arclog-constructions" }
# The reader of the snapshot of the Souffle outcomes, whose files are JSON.
serde_json = "1.0.154"
