[package]
name = "arclog-tables"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The tables are read from a decoder and a checked program of the core crate,
# through its read-only accessors.
arclog = { path = "../arclog" }
serde_json = "1"

[dev-dependencies]
# The explicit gold-normalization audit uses the production component executor.
arclog-constructions = { path = "../arclog-constructions" }
